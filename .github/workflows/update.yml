name: Update tracker
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull and build
        env:
          PIRO_USER: ${{ secrets.PIRO_USER }}
          PIRO_PW: ${{ secrets.PIRO_PW }}
        run: |
          python3 pull.py
          python3 build.py
      - name: Commit page and history
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html history.json
          git commit -m "Auto-update $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "no changes"
          git push
