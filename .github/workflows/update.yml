name: Update tracker
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

# contents: write is for the data branch (journal state), pages/id-token for the
# Pages deployment. main is never committed to by this workflow.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Journal state lives on the orphan `data` branch, not main. On the very
      # first run (no data branch yet) the seed history.json from main is used.
      - name: Restore state from data branch
        run: |
          if git fetch origin data 2>/dev/null; then
            for f in history.json history_archive.json log.txt; do
              git checkout FETCH_HEAD -- "$f" 2>/dev/null || true
            done
            echo "state restored from data branch"
          else
            echo "no data branch yet - using seed files from main (first run)"
          fi

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Pull orders and build data.json
        env:
          PIRO_USER: ${{ secrets.PIRO_USER }}
          PIRO_PW: ${{ secrets.PIRO_PW }}
        run: python3 main.py

      - name: Save state to data branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if git fetch origin data 2>/dev/null; then
            git worktree add state FETCH_HEAD
          else
            git worktree add --detach state
            git -C state checkout --orphan data
            git -C state rm -rf --quiet . || true
          fi
          for f in history.json history_archive.json log.txt; do
            [ -f "$f" ] && cp "$f" state/
          done
          cd state
          git add -A
          git commit -m "State $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "no state changes"
          git push origin HEAD:data

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
